version: 2

project_name: checkpointz

before:
  hooks:
    # Verify downloaded modules against go.sum. The release build does not
    # modify go.mod or go.sum.
    - go mod verify
    - go generate ./...
    - make build-web
builds:
  - env:
      - CGO_ENABLED=0
    binary: checkpointz-{{.Version}}
    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goarch: 386
    ldflags:
      - -s -w -X github.com/ethpandaops/checkpointz/pkg/version.Release={{.Tag}} -X github.com/ethpandaops/checkpointz/pkg/version.GitCommit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"
checksum:
  name_template: 'checksums.txt'
# SPDX SBOM per release archive (syft must be on PATH). SBOMs are listed in
# checksums.txt, so the release workflow's signature over checksums.txt
# covers them too.
sboms:
  - artifacts: archive
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Container images are not built here. The release workflow
# (.github/workflows/goreleaser.yaml) builds them from the binaries in dist/
# with goreleaser-*.Dockerfile in a job without credentials, and a separate
# publish job pushes them by digest.
